    L.dots = dots;
    L.dotsTimer = setTimeout(() => {
      if (!L.loading) return;
      lstage.classList.add('dots-on');
      const start = performance.now();
      const frame = () => { drawDots(dots, (performance.now() - start) / 1000, 0); if (L.loading) L.raf = requestAnimationFrame(frame); };
      frame();
    }, 150);
    reportLoading();
    L.items.forEach((item) => loadLayer(item));
    // Put back how the user left the layers (and only then start keeping changes).
    const baseId = L.baseId;
    (state.caps && state.caps.serverTools === false ? Promise.resolve(null) : request('tools/call', { name: 'get_layer_set', arguments: { id: baseId } }, 10000).catch(() => null))
      .then((res) => {
        const saved = res && res.structuredContent && res.structuredContent.arrangement;
        if (L.baseId !== baseId) return;
        if (saved) {
          L.items.forEach((item) => {
            const id = item.image.id;
            const move = saved.moves && saved.moves[id];
            if (move && item.i > 0) { item.dx = Number(move[0]) || 0; item.dy = Number(move[1]) || 0; }
            // Size, turn, mirror and order came later: an arrangement kept without them loads as it was.
            const s = Number((saved.scale && saved.scale[id]) || (saved.scales && saved.scales[id])), r = saved.rotation && Number(saved.rotation[id]);
            if (item.i > 0 && s > 0) item.s = Math.min(SCALE_MAX, Math.max(SCALE_MIN, s));
            if (item.i > 0 && Number.isFinite(r)) item.r = normDeg(r);
            item.fx = item.i > 0 && Array.isArray(saved.flipX) && saved.flipX.includes(id);
            placeLayer(item);
            setHidden(item, Boolean(saved.hidden && saved.hidden.includes(id)));
          });
          if (Array.isArray(saved.order)) {
            const byId = new Map(L.items.map((item) => [item.image.id, item.i]));
            const given = [...new Set(saved.order.map((id) => byId.get(id)).filter((i) => i > 0))];
            L.order = [...given, ...L.order.filter((i) => !given.includes(i))];
            applyOrder();
          }
          updateFrame();
        }
        L.keep = true;
      });
    const facts = [data.providerLabel || data.provider, data.model, data.images.length + ' layers'];
    if (data.seconds) facts.push(data.seconds + 's');
    if (data.leftOut) facts.push(data.leftOut + ' small left out');
    if (data.credits && data.credits.left <= 10) facts.push(data.credits.left + (data.credits.left === 1 ? ' credit left' : ' credits left'));
    const first = data.images[0];
    if (first.path) facts.push('Saved to ' + (first.shown || first.path) + ' and ' + (data.images.length - 1) + ' more');
    meta.textContent = facts.filter(Boolean).join(' · ');
    if (data.credits && data.credits.left <= 10 && data.credits.url) {
      const topup = document.createElement('button');
      topup.type = 'button';
      topup.className = 'topup';
      topup.textContent = 'Add credits';
      topup.addEventListener('click', () => request('ui/open-link', { url: data.credits.url }).catch(() => {}));
      meta.append(' ', topup);
    }
    meta.hidden = false;
    reportSize();
  }

  /** How many layers are shown or have failed; the status line over the stage says how far along it is. */
  function reportLoading() {
    const total = L.items.length;
    const done = L.items.filter((item) => item.shown || item.failed).length;
    if (done >= total) {
      L.loading = false;
      clearTimeout(L.dotsTimer);
      cancelAnimationFrame(L.raf);
      lstage.classList.remove('loading', 'dots-on');
      $('status').hidden = true;
      // Everything appears together.
      L.items.forEach((item) => { if (item.shown) { item.el.classList.remove('nopic'); placeLayer(item); item.img.classList.add('ready'); } });
      updateFrame();
      return;
    }
    setStatus('Loading the layers' + (L.items.length > 1 ? ' (' + done + ' of ' + total + ')' : ''));
  }

  function markFailed(item) {
    item.failed = true;
    item.row.classList.remove('pending');
    item.el.classList.add('nopic');
    item.eye.hidden = true;
    const why = document.createElement('span');
    why.className = 'why';
    why.textContent = 'Could not load this layer';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'retry';
    retry.textContent = 'Retry';
    retry.addEventListener('click', () => { why.remove(); retry.remove(); item.eye.hidden = false; loadLayer(item); });
    item.nmbox.appendChild(why);
    item.row.appendChild(retry);
    reportLoading();
  }

  /**
   * One layer. The stage draws from a display-size copy, never the full file: first the small copy that came with the
   * result (nothing to fetch), then a ~1024px copy from the server (a link where the app allows it, else a tool call).
   * The full image is fetched only when it is downloaded. A picture is given to its <img> only once it has loaded.
   */
  async function loadLayer(item) {
    item.failed = false;
    item.row.classList.add('pending');
    const show = async (src) => {
      await tryImage(item.img, src, 60000);
      if (!item.shown) {
        item.shown = true;
        item.row.classList.remove('pending');
        if (L.loading) reportLoading();
        else { item.el.classList.remove('nopic'); placeLayer(item); item.img.classList.add('ready'); }
      }
    };
    const quick = quickCopy(L.result, item.image, item.i);
    if (quick) await show(quick.src).catch(() => {});
    const noTools = state.caps && !state.caps.serverTools;
    const upgrades = [
      () => (item.image.view ? show(item.image.view) : Promise.reject(new Error('none'))),
      () => (noTools ? Promise.reject(new Error('no tool calls')) : fetchImage(item.image.id, 1024).then(show)),
    ];
    for (const step of upgrades) {
      try { await step(); break; } catch (e) { /* the next way */ }
    }
    // Nothing else worked: the full picture's own address, if the app lets it be loaded.
    if (!item.shown && item.image.src) await show(item.image.src).catch(() => {});
    if (!item.shown) markFailed(item);
  }

  // Pixels the canvas can use without being tainted: a data address.
  const blobToDataUri = (blob) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error('read failed')); r.readAsDataURL(blob); });
  // The full picture of a layer, as something an image can load: fetched once, however many times it is asked for
  // and by however many callers at once. By its link where the app allows it, else from the server in pieces.
  function pixelsOf(item) {
    if (!item.fetching) {
      item.fetching = (async () => {
        if (item.image.src) {
          try {
            const res = await fetch(item.image.src, { mode: 'cors' });
            if (res.ok) {
              // Kept as it arrived where the app lets a picture load from memory: turning megabytes into base64
              // and back only to draw them is time for nothing. Where it does not, base64 it is.
              const blob = await res.blob();
              const url = URL.createObjectURL(blob);
              try { await decode(url); return (item.full = url); } catch (e) { URL.revokeObjectURL(url); }
              return (item.full = await blobToDataUri(blob));
            }
          } catch (e) { /* not allowed from here: ask the server instead */ }
        }
        return (item.full = await fetchImage(item.image.id));
      })();
      // A fetch that failed may be tried again by the next press.
      item.fetching.catch(() => { item.fetching = null; });
    }
    return item.fetching;
  }
  // Every layer that will be drawn, fetched a few at a time instead of one after another; `tell` hears how many are in.
  async function gather(items, tell) {
    let next = 0, got = 0;
    const out = new Array(items.length);
    const worker = async () => {
      while (next < items.length) {
        const at = next++;
        out[at] = await decode(await pixelsOf(items[at]));
        if (tell) tell(++got, items.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(4, items.length) }, worker));
    return out;
  }
  const decode = (uri) => new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('could not read an image')); i.src = uri; });

  /** The arrangement as it is now (moved and hidden layers applied), as one PNG at the base's full size. */
  async function composite(tell) {
    const drawn = [0, ...L.order].map((index) => L.items[index]).filter((item) => item.i === 0 || !item.hidden);
    const pictures = new Map((await gather(drawn, tell)).map((img, at) => [drawn[at], img]));
    const first = pictures.get(L.items[0]);
    const W = first.naturalWidth, H = first.naturalHeight;
    if (!L.W) { L.W = W; L.H = H; L.items.forEach(placeLayer); }
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    // Back to front, each layer turned, mirrored and scaled about its middle: the same as the stage draws it.
    for (const index of [0, ...L.order]) {
      const item = L.items[index];
      if (item.hidden) continue;
      const img = pictures.get(item);
      if (item.i === 0) { ctx.drawImage(img, 0, 0, W, H); continue; }
      const b = layerBox(item.image);
      if (!b) continue;
      const w = (b[2] - b[0]) * W, h = (b[3] - b[1]) * H;
      ctx.save();
      ctx.translate(((b[0] + b[2]) / 2 + item.dx) * W, ((b[1] + b[3]) / 2 + item.dy) * H);
      ctx.rotate((item.r * Math.PI) / 180);
      ctx.scale(item.fx ? -item.s : item.s, item.s);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
    return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('could not make the picture'))), 'image/png'));
  }

  async function saveBlob(blob, name) {
    if (state.caps && state.caps.downloadFile) {
      try {
        const data = (await blobToDataUri(blob)).split(',')[1];
        const res = await request('ui/download-file', { contents: [{ type: 'resource', resource: { uri: 'file:///' + name, mimeType: blob.type || 'image/png', blob: data } }] }, 60000);
        if (!(res && res.isError)) return;
      } catch (e) { /* fall back to a plain download */ }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  /** Dots on a button while it works. */
  const busy = (button, on) => { button.disabled = on; button.classList.toggle('busy', on); button.setAttribute('aria-busy', String(on)); };

  async function downloadComposite() {
    const button = $('ldl-image');
    const words = button.textContent;
    busy(button, true);
    try {
      // The wait is the full-size layers arriving: say how many are in, so it is not a blank wait.
      const blob = await composite((got, total) => { button.textContent = got < total ? 'Fetching layers ' + got + ' of ' + total : 'Making the image'; });
      await saveBlob(blob, 'layers-composite.png');
    } catch (e) {
      errorBox.textContent = 'Could not make the picture: ' + (e && e.message ? e.message : 'failed');
      errorBox.hidden = false;
    }
    button.textContent = words;
    busy(button, false);
  }

  // The full-size layers start arriving as soon as the pointer or the keyboard reaches Download image, so most of the
  // wait is over by the time it is pressed. Nothing is fetched for someone who only looks.
  const warmLayers = () => { if (L.on && !L.loading) gather(L.items.filter((item) => item.i === 0 || !item.hidden)).catch(() => {}); };
  $('ldl-image').addEventListener('pointerenter', warmLayers);
  $('ldl-image').addEventListener('focus', warmLayers);

  async function downloadAll() {
    const button = $('ldl-all');
    busy(button, true);
    for (const item of L.items) {
      await download(item.image);
      await new Promise((r) => setTimeout(r, 350));
    }
    busy(button, false);
  }

  // Everything back as the split made it: places, sizes, order, and nothing hidden. A drag still in hand is let go
  // first (or its next movement would put the layer back where it was), and it is kept at once, not a moment later.
  function resetLayers() {
    endGesture();
    L.items.forEach((item) => { item.dx = item.dy = 0; item.s = 1; item.r = 0; item.fx = false; placeLayer(item); setHidden(item, false); });
    L.order = [];
    applyOrder();
    keepArrangement(true);
    updateFrame();
  }

  $('ldl-image').addEventListener('click', downloadComposite);
  $('ldl-layer').addEventListener('click', async () => {
    if (L.sel < 0) return;
    const button = $('ldl-layer');
    busy(button, true);
    await download(L.items[L.sel].image);
    busy(button, false);
    button.disabled = L.sel < 0;
  });
  $('ldl-all').addEventListener('click', downloadAll);
  $('lreset').addEventListener('click', resetLayers);
  document.addEventListener('keydown', (event) => {
    if (!L.on || L.sel < 0 || event.target.tagName === 'INPUT') return;
    const item = L.items[L.sel];
    const step = event.shiftKey ? 0.05 : 0.005;
    const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (move && item.i > 0) { event.preventDefault(); nudge(item, item.dx + move[0], item.dy + move[1]); }
    else if (item.i > 0 && event.key === '[') { event.preventDefault(); turnBy(item, -15, true); }
    else if (item.i > 0 && event.key === ']') { event.preventDefault(); turnBy(item, 15, true); }
    else if (item.i > 0 && (event.key === '+' || event.key === '=')) { event.preventDefault(); scaleBy(item, 1.05); }
    else if (item.i > 0 && (event.key === '-' || event.key === '_')) { event.preventDefault(); scaleBy(item, 1 / 1.05); }
    else if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); setHidden(item, true); selectLayer(-1); }
    else if (event.key === 'Escape') { event.preventDefault(); selectLayer(-1); }
  });

  // ---- adding the user's own image: drop, choose or paste; shrunk here if large, then sent straight to the site if the app allows it, else to the server in pieces through the app ----
  const PART_BYTES = 192 * 1024; // 256 KB of base64 a piece: well under what a message through the app or a server function takes
  const UP_MAX_EDGE = 4096, UP_MAX_BYTES = 8 * 1024 * 1024, UP_MAX_FILE = 40 * 1024 * 1024;
  const up = { busy: false, direct: true }; // direct: false once sending straight to the site has failed, so the card does not ask for another address
  const dropBox = $('drop'), filePick = $('filepick'), upErr = $('uperr');

  function showUpload(data) {
    if (up.busy) return; // the result arriving after the input must not interrupt a file already on its way
    stopWaiting();
    useGallery(true);
    gallery.hidden = true;
    $('upload').hidden = false;
    // On the hosted service there is also a page on the site, for when a file cannot be added in this frame.
    if (data && data.uploadPage) up.page = String(data.uploadPage);
    $('uppage').hidden = !up.page;
    errorBox.hidden = true;
    meta.hidden = true;
    stage.replaceChildren();
    setUpBusy(false);
  }

  function setUpBusy(on, text) {
    up.busy = on;
    dropBox.classList.toggle('busy', on);
    $('droptitle').textContent = on ? (text || 'Adding your image') : 'Add your image';
    $('dropsub').textContent = on ? 'This takes a moment' : 'Drop a file here, or paste one';
    dropBox.setAttribute('aria-busy', String(on));
  }

  function upFail(text) {
    setUpBusy(false);
    upErr.textContent = text;
    upErr.hidden = false;
  }

  /** What the file's first bytes say it is, not what its name says. */
  async function sniff(file) {
    const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'image/png';
    if (b[0] === 0xff && b[1] === 0xd8) return 'image/jpeg';
    if (String.fromCharCode(b[0], b[1], b[2], b[3]) === 'RIFF' && String.fromCharCode(b[8], b[9], b[10], b[11]) === 'WEBP') return 'image/webp';
    return null;
  }

  /** The file as it will be sent: as it is when small enough, else scaled down (long side 4096) and re-encoded. */
  async function prepareUpload(file, type) {
    let bitmap;
    try { bitmap = await createImageBitmap(file); } catch (e) { throw new Error('That image could not be read.'); }
    const long = Math.max(bitmap.width, bitmap.height);
    if (long <= UP_MAX_EDGE && file.size <= UP_MAX_BYTES) { if (bitmap.close) bitmap.close(); return file; }
    const scale = Math.min(1, UP_MAX_EDGE / long);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const ctx = canvas.getContext('2d');
    const encode = (kind, quality) => new Promise((resolve) => canvas.toBlob(resolve, kind, quality));
    let blob = null;
    if (type === 'image/png') { ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height); blob = await encode('image/png'); }
    if (!blob || blob.size > UP_MAX_BYTES) {
      // A JPEG has no transparency: the picture goes on white.
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      blob = await encode('image/jpeg', 0.92);
      if (blob && blob.size > UP_MAX_BYTES) blob = await encode('image/jpeg', 0.8);
    }
    if (bitmap.close) bitmap.close();
    if (!blob || blob.size > UP_MAX_BYTES) throw new Error('That image is too large to add, even scaled down.');
    return blob;
  }

  const base64Of = (bytes) => {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(binary);
  };

  /** Sends the image in pieces through the app, one tool call each; the answer is the card's data for the new image. */
  async function sendInPieces(blob, name) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const total = Math.max(1, Math.ceil(bytes.length / PART_BYTES));
    const id = Array.from(crypto.getRandomValues(new Uint8Array(24)), (n) => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join('');
    for (let index = 0; index < total; index++) {
      setUpBusy(true, 'Adding your image (' + (index + 1) + ' of ' + total + ')');
      const res = await request('tools/call', { name: 'upload_image_part', arguments: { upload: id, index, data: base64Of(bytes.subarray(index * PART_BYTES, (index + 1) * PART_BYTES)) } }, 60000);
      if (res && res.isError) throw new Error(((res.content || []).find((c) => c.type === 'text') || {}).text || 'The image could not be added.');
    }
    const done = await request('tools/call', { name: 'finish_image_upload', arguments: { upload: id, total, name } }, 60000);
    if (!done || done.isError) throw new Error(((done && done.content) || []).map((c) => c.text).filter(Boolean).join(' ') || 'The image could not be added.');
    const data = done.structuredContent;
    if (!data || !Array.isArray(data.images)) throw new Error('The image could not be added.');
    return data;
  }

  /**
   * Sends the image straight to tintloom.com: the app gives the card an upload address, the bytes go there with fetch (the
   * site's address is in the card's connect-src), and the app is asked only to open the finished image. A file that fits in one
   * piece is one request to /done; a bigger one goes as pieces to /part/<n>, a few at a time, then /done?parts=<count>.
   * Throws on any failure, and the caller falls back to the pieces through the app.
   */
  async function sendDirect(blob, name) {
    if (typeof fetch !== 'function') throw new Error('no fetch'); // (http is accepted for a local address only: the preview host)
    const ticket = await request('tools/call', { name: 'get_upload_ticket', arguments: {} }, 20000);
    const t = ticket && !ticket.isError && ticket.structuredContent;
    if (!t || typeof t.upload_url !== 'string' || !/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(t.upload_url) || !(t.part_bytes > 0)) throw new Error('no upload address');
    const base = t.upload_url.replace(/\/+$/, '');
    const post = async (path, body) => {
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 120000);
      try {
        const res = await fetch(base + path, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body, signal: abort.signal, credentials: 'omit', cache: 'no-store' });
        const json = await res.json().catch(() => null);
        if (!res.ok) throw new Error((json && json.error) || 'The image could not be added.');
        return json;
      } finally { clearTimeout(timer); }
    };
    const total = Math.max(1, Math.ceil(blob.size / t.part_bytes));
    let finished = null;
    if (total === 1) {
      setUpBusy(true, 'Adding your image');
      finished = await post('/done', blob);
    } else {
      let sent = 0, next = 0;
      const worker = async () => {
        while (next < total) {
          const index = next++;
          await post('/part/' + index, blob.slice(index * t.part_bytes, (index + 1) * t.part_bytes));
          setUpBusy(true, 'Adding your image (' + (++sent) + ' of ' + total + ')');
        }
      };
      setUpBusy(true, 'Adding your image (0 of ' + total + ')');
      await Promise.all(Array.from({ length: Math.min(3, total) }, worker));
      finished = await post('/done?parts=' + total, null);
    }
    if (!finished || typeof finished.id !== 'string') throw new Error('The image could not be added.');
    const done = await request('tools/call', { name: 'finish_direct_upload', arguments: { id: finished.id, name } }, 60000);
    const data = done && !done.isError && done.structuredContent;
    if (!data || !Array.isArray(data.images)) throw new Error('The image could not be added.');
    return data;
  }

  async function handleFile(file) {
    if (!file || up.busy) return;
    upErr.hidden = true;
    if (file.size > UP_MAX_FILE) return upFail('That file is larger than 40 MB.');
    const type = await sniff(file);
    if (!type) return upFail('That is not a PNG, JPEG or WebP image. Choose one of those.');
    if (state.caps && state.caps.serverTools === false) return upFail('This app does not let the card send an image to Tintloom.');
    try {
      setUpBusy(true, 'Preparing your image');
      const blob = await prepareUpload(file, type);
      let data = null;
      if (up.direct) {
        try { data = await sendDirect(blob, file.name || ''); } catch (e) { up.direct = false; data = null; } // any failure: the pieces path below
      }
      if (!data) data = await sendInPieces(blob, file.name || '');
      up.busy = false;
      $('upload').hidden = true;
      state.args = {};
      showResultData(data, { content: [] });
      // Tell Claude, with the id, so it carries on with what the user asked; the server already knows this is the open image.
      await say('My image is added (id ' + data.images[0].id + '). Please carry on with what I asked, using it.', 'My image is added: ' + refer() + '. Please carry on with what I asked, using it.');
      openEditor(0);
    } catch (e) {
      upFail(e && e.message ? e.message : 'The image could not be added.');
    }
  }

  $('choose').addEventListener('click', (event) => { event.stopPropagation(); if (!up.busy) filePick.click(); });
  dropBox.addEventListener('click', () => { if (!up.busy) filePick.click(); });
  dropBox.addEventListener('keydown', (event) => { if ((event.key === 'Enter' || event.key === ' ') && event.target === dropBox) { event.preventDefault(); if (!up.busy) filePick.click(); } });
  filePick.addEventListener('change', () => { const file = filePick.files && filePick.files[0]; filePick.value = ''; handleFile(file); });
  ['dragenter', 'dragover'].forEach((name) => dropBox.addEventListener(name, (event) => { event.preventDefault(); dropBox.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((name) => dropBox.addEventListener(name, (event) => { event.preventDefault(); dropBox.classList.remove('over'); }));
  dropBox.addEventListener('drop', (event) => { const files = event.dataTransfer && event.dataTransfer.files; handleFile(files && files[0]); });
  document.addEventListener('paste', (event) => {
    if ($('upload').hidden) return;
    const items = (event.clipboardData && event.clipboardData.files) || [];
    if (items.length) { event.preventDefault(); handleFile(items[0]); }
  });
  $('uplink').addEventListener('click', () => { if (up.page) request('ui/open-link', { url: up.page }).catch(() => {}); });
  $('split').addEventListener('click', () => say('Split this image into layers', 'Split ' + refer() + ' into layers: call generate_image with layers: true and images: [{ id }].'));

  // ---- wiring ----
  tools.querySelectorAll('[data-tool]').forEach((button) => button.addEventListener('click', () => setTool(button.dataset.tool)));
  $('cancel').addEventListener('click', () => setTool(null));
  $('close').addEventListener('click', () => closeEditor());
  $('send').addEventListener('click', sendTool);
  $('apply').addEventListener('click', applyEdit);
  editBox.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.isComposing) applyEdit(); });
  $('save').addEventListener('click', () => download(current()));
  $('vary').addEventListener('click', () => say('Make 3 variations of this image', 'Make 3 variations of ' + refer() + '.'));
  $('removebg').addEventListener('click', () => say('Remove the background of this image', 'Remove the background from ' + refer() + '. Keep the subject exactly as it is and give me a PNG with a transparent background.'));
  $('undo').addEventListener('click', () => {
    if (state.tool === 'comment') {
      const pin = state.pins.pop();
      if (pin) { pin.dot.remove(); pin.note.remove(); }
    } else {
      state.strokes.pop();
      redraw();
    }
    refreshToolbar();
  });
  $('resize').addEventListener('click', () => {
    sizes.hidden = !sizes.hidden;
    $('resize').setAttribute('aria-expanded', String(!sizes.hidden));
  });
  sizes.querySelectorAll('button').forEach((button) => button.addEventListener('click', () =>
    say('Resize this image to ' + button.dataset.ratio + ' (' + button.dataset.name + ')', 'Resize ' + refer() + ' to ' + button.dataset.ratio + ' (' + button.dataset.name + '). Keep the scene and extend or recompose it to fit the new shape.')));
  document.addEventListener('keydown', (event) => {
    if (state.editing && !state.tool && event.target.tagName !== 'INPUT' && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) return page(event.key === 'ArrowRight' ? 1 : -1);
    if (event.key !== 'Escape' || !state.editing) return;
    if (!sizes.hidden) sizes.hidden = true;
    else if (state.tool) setTool(null);
    else closeEditor();
  });

  // ---- size reporting and start-up ----
  let lastHeight = -1;
  function reportSize(again) {
    const width = Math.ceil(document.documentElement.clientWidth);
    const height = Math.ceil($('app').getBoundingClientRect().height);
    // Not laid out (the app keeps the card out of sight for now): a size taken now would be wrong, and an app that
    // follows it would close the card to nothing. It is sent as soon as there is one.
    if (!(width > 0) || !(height > 0)) return;
    if (height === lastHeight && again !== true) return;
    lastHeight = height;
    notify('ui/notifications/size-changed', { width, height });
  }
  // Watch the content itself: the root element's box follows the frame, not the content.
  new ResizeObserver(() => reportSize()).observe($('app'));
  new MutationObserver(() => reportSize()).observe($('app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class', 'style'] });
  window.addEventListener('resize', () => reportSize());
  window.addEventListener('error', (event) => { if (!stage.children.length && errorBox.hidden) problem(event.error || event); });

  // A host may mount the card while the tool is still running yet send no input at all (or send it only once the
  // call returns). Without this the card stays blank and a few pixels tall, so the host shows nothing. If neither
  // input nor result has come, show the waiting dots; a result replaces them.
  const dotsIfIdle = () => { if (!state.result && !state.args) { state.args = {}; showWaiting(); } };

  // The first words with the app. They used to be said once: one request with ten seconds to be answered, then one
  // "ready" and one size. An app that was busy (several large results arriving together, a machine short of memory)
  // and started listening after that heard none of it, so it never sent the result and never opened the frame: the
  // card stayed an empty strip for good. Now the card keeps asking until it is answered, takes the answer however
  // late it comes, and keeps telling its size until the app has spoken.
  fitPage();
  const born = Date.now();
  let answered = false, greeted = false;
  const greet = () => { greeted = true; notify('ui/notifications/initialized'); };
  function hello() {
    request('ui/initialize', {
      protocolVersion: '2026-01-26',
      appInfo: { name: 'tintloom', version: '0.8.21' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    }, 0).then((res) => {
      if (answered) return;
      answered = true;
      // What the app says it supports, kept for error messages.
      state.caps = (res && res.hostCapabilities) || null;
      state.hostCaps = res && res.hostCapabilities ? Object.keys(res.hostCapabilities).join(',') || 'none' : 'not stated';
      if (res && res.hostInfo) state.hostCaps += ' / ' + (res.hostInfo.name || '') + ' ' + (res.hostInfo.version || '');
      try { applyContext(res && res.hostContext); } catch (error) { problem(error); }
      // Said again after a late answer unless the app is already talking: it may not have been listening the first time.
      if (!greeted || !state.heard) greet();
      reportSize(true);
      // A card reopened from history gets its result at once, well inside this delay, and never flashes the dots.
      setTimeout(dotsIfIdle, 800);
    }, () => {});
  }
  hello();
  reportSize();
  let beats = 0;
  const pulse = setInterval(() => {
    const age = Date.now() - born;
    beats++;
    if ((answered && state.heard) || age > 15 * 60000) return clearInterval(pulse);
    // An app that never answers the first request (an older one) is still told the card is ready, as before.
    if (!answered && !greeted && age >= 10000) greet();
    if (!answered && age >= 2500) dotsIfIdle();
    // Ask again, less and less often: at 3, 6 and 12 seconds, then every 16.
    if (!answered && (beats === 3 || beats === 6 || beats === 12 || (beats > 12 && beats % 16 === 0))) hello();
    if (!state.heard) reportSize(true);
  }, 1000);
})();
</script>
</body>
</html>
