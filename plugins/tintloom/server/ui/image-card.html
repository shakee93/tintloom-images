      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = name;
      nmbox.appendChild(nm);
      pick.append(th, nmbox);
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      row.append(pick, eye);
      row.classList.add('pending');
      el.classList.add('nopic');
      const item = { i: index, image, name, el, img, row, pick, eye, th, nmbox, dx: 0, dy: 0, hidden: false, shown: false, failed: false, full: null };
      L.items.push(item);
      pick.addEventListener('click', () => selectLayer(index));
      eye.addEventListener('click', () => setHidden(item, !item.hidden));
      setHidden(item, false);
      placeLayer(item);
      img.addEventListener('load', () => {
        if (th.getAttribute('src') !== img.currentSrc) th.src = img.currentSrc || img.src;
        if (index === 0 && img.naturalWidth) setLayerRatio(img.naturalWidth, img.naturalHeight);
      });
      // Dragging: a layer follows the pointer (mouse, pen or finger) until it is let go.
      let drag = null;
      el.addEventListener('pointerdown', (event) => {
        if (event.button > 0 || L.loading || !item.shown) return;
        selectLayer(index);
        if (index === 0) return;
        const rect = lstage.getBoundingClientRect();
        if (!rect.width) return;
        drag = { x: event.clientX, y: event.clientY, dx: item.dx, dy: item.dy, rect };
        try { el.setPointerCapture(event.pointerId); } catch (e) { /* not capturable: the move events still arrive over the stage */ }
        el.classList.add('drag');
        event.preventDefault();
      });
      el.addEventListener('pointermove', (event) => {
        if (drag) nudge(item, drag.dx + (event.clientX - drag.x) / drag.rect.width, drag.dy + (event.clientY - drag.y) / drag.rect.height);
      });
      const stop = () => { drag = null; el.classList.remove('drag'); };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
      // Top layer first in the list, as in an editor.
      llist.insertBefore(row, llist.firstChild);
    });
    selectLayer(-1);
    state.selected = 0;
    // The same dots as while an image is made, over the stage until every layer has something to show. A load that
    // is over within a moment never shows them.
    const dots = document.createElement('canvas');
    dots.className = 'dots';
    dots.setAttribute('aria-hidden', 'true');
    lstage.appendChild(dots);
    L.dotsTimer = setTimeout(() => {
      if (!L.loading) return;
      lstage.classList.add('dots-on');
      const start = performance.now();
      const frame = () => { drawDots(dots, (performance.now() - start) / 1000, 0); if (L.loading) L.raf = requestAnimationFrame(frame); };
      frame();
    }, 150);
    reportLoading();
    L.items.forEach((item) => loadLayer(item));
    // Put back how the user left the layers (and only then start keeping changes).
    const baseId = L.baseId;
    (state.caps && state.caps.serverTools === false ? Promise.resolve(null) : request('tools/call', { name: 'get_layer_set', arguments: { id: baseId } }, 10000).catch(() => null))
      .then((res) => {
        const saved = res && res.structuredContent && res.structuredContent.arrangement;
        if (L.baseId !== baseId) return;
        if (saved) {
          L.items.forEach((item) => {
            const move = saved.moves && saved.moves[item.image.id];
            if (move && item.i > 0) { item.dx = Number(move[0]) || 0; item.dy = Number(move[1]) || 0; placeLayer(item); }
            setHidden(item, Boolean(saved.hidden && saved.hidden.includes(item.image.id)));
          });
        }
        L.keep = true;
      });
    const facts = [data.providerLabel || data.provider, data.model, data.images.length + ' layers'];
    if (data.seconds) facts.push(data.seconds + 's');
    if (data.leftOut) facts.push(data.leftOut + ' small left out');
    if (data.credits && data.credits.left <= 10) facts.push(data.credits.left + (data.credits.left === 1 ? ' credit left' : ' credits left'));
    const first = data.images[0];
    if (first.path) facts.push('Saved to ' + (first.shown || first.path) + ' and ' + (data.images.length - 1) + ' more');
    meta.textContent = facts.filter(Boolean).join(' · ');
    if (data.credits && data.credits.left <= 10 && data.credits.url) {
      const topup = document.createElement('button');
      topup.type = 'button';
      topup.className = 'topup';
      topup.textContent = 'Top up';
      topup.addEventListener('click', () => request('ui/open-link', { url: data.credits.url }).catch(() => {}));
      meta.append(' ', topup);
    }
    meta.hidden = false;
    reportSize();
  }

  /** How many layers are shown or have failed; the status line over the stage says how far along it is. */
  function reportLoading() {
    const total = L.items.length;
    const done = L.items.filter((item) => item.shown || item.failed).length;
    if (done >= total) {
      L.loading = false;
      clearTimeout(L.dotsTimer);
      cancelAnimationFrame(L.raf);
      lstage.classList.remove('loading', 'dots-on');
      $('status').hidden = true;
      // Everything appears together.
      L.items.forEach((item) => { if (item.shown) { item.el.classList.remove('nopic'); placeLayer(item); item.img.classList.add('ready'); } });
      return;
    }
    setStatus('Loading the layers' + (L.items.length > 1 ? ' (' + done + ' of ' + total + ')' : ''));
  }

  function markFailed(item) {
    item.failed = true;
    item.row.classList.remove('pending');
    item.el.classList.add('nopic');
    item.eye.hidden = true;
    const why = document.createElement('span');
    why.className = 'why';
    why.textContent = 'Could not load this layer';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'retry';
    retry.textContent = 'Retry';
    retry.addEventListener('click', () => { why.remove(); retry.remove(); item.eye.hidden = false; loadLayer(item); });
    item.nmbox.appendChild(why);
    item.row.appendChild(retry);
    reportLoading();
  }

  /**
   * One layer. The stage draws from a display-size copy, never the full file: first the small copy that came with the
   * result (nothing to fetch), then a ~1024px copy from the server (a link where the app allows it, else a tool call).
   * The full image is fetched only when it is downloaded. A picture is given to its <img> only once it has loaded.
   */
  async function loadLayer(item) {
    item.failed = false;
    item.row.classList.add('pending');
    const show = async (src) => {
      await tryImage(item.img, src, 60000);
      if (!item.shown) {
        item.shown = true;
        item.row.classList.remove('pending');
        if (L.loading) reportLoading();
        else { item.el.classList.remove('nopic'); placeLayer(item); item.img.classList.add('ready'); }
      }
    };
    const quick = quickCopy(L.result, item.image, item.i);
    if (quick) await show(quick.src).catch(() => {});
    const noTools = state.caps && !state.caps.serverTools;
    const upgrades = [
      () => (item.image.view ? show(item.image.view) : Promise.reject(new Error('none'))),
      () => (noTools ? Promise.reject(new Error('no tool calls')) : fetchImage(item.image.id, 1024).then(show)),
    ];
    for (const step of upgrades) {
      try { await step(); break; } catch (e) { /* the next way */ }
    }
    // Nothing else worked: the full picture's own address, if the app lets it be loaded.
    if (!item.shown && item.image.src) await show(item.image.src).catch(() => {});
    if (!item.shown) markFailed(item);
  }

  // Pixels the canvas can use without being tainted: a data address.
  const blobToDataUri = (blob) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error('read failed')); r.readAsDataURL(blob); });
  // The full-size picture, fetched when it is wanted (a download) and kept for the next one.
  async function pixelsOf(item) {
    if (item.full) return item.full;
    if (item.image.src) {
      try {
        const res = await fetch(item.image.src, { mode: 'cors' });
        if (res.ok) return (item.full = await blobToDataUri(await res.blob()));
      } catch (e) { /* not allowed from here: ask the server instead */ }
    }
    return (item.full = await fetchImage(item.image.id));
  }
  const decode = (uri) => new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('could not read an image')); i.src = uri; });

  /** The arrangement as it is now (moved and hidden layers applied), as one PNG at the base's full size. */
  async function composite() {
    const first = await decode(await pixelsOf(L.items[0]));
    const W = first.naturalWidth, H = first.naturalHeight;
    if (!L.W) { L.W = W; L.H = H; L.items.forEach(placeLayer); }
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    for (const item of L.items) {
      if (item.hidden) continue;
      const img = item.i === 0 ? first : await decode(await pixelsOf(item));
      if (item.i === 0) { ctx.drawImage(img, 0, 0, W, H); continue; }
      const b = layerBox(item.image);
      if (b) ctx.drawImage(img, (b[0] + item.dx) * W, (b[1] + item.dy) * H, (b[2] - b[0]) * W, (b[3] - b[1]) * H);
    }
    return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('could not make the picture'))), 'image/png'));
  }

  async function saveBlob(blob, name) {
    if (state.caps && state.caps.downloadFile) {
      try {
        const data = (await blobToDataUri(blob)).split(',')[1];
        const res = await request('ui/download-file', { contents: [{ type: 'resource', resource: { uri: 'file:///' + name, mimeType: blob.type || 'image/png', blob: data } }] }, 60000);
        if (!(res && res.isError)) return;
      } catch (e) { /* fall back to a plain download */ }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  /** Dots on a button while it works. */
  const busy = (button, on) => { button.disabled = on; button.classList.toggle('busy', on); button.setAttribute('aria-busy', String(on)); };

  async function downloadComposite() {
    const button = $('ldl-image');
    busy(button, true);
    try {
      await saveBlob(await composite(), 'layers-composite.png');
    } catch (e) {
      errorBox.textContent = 'Could not make the picture: ' + (e && e.message ? e.message : 'failed');
      errorBox.hidden = false;
    }
    busy(button, false);
  }

  async function downloadAll() {
    const button = $('ldl-all');
    busy(button, true);
    for (const item of L.items) {
      await download(item.image);
      await new Promise((r) => setTimeout(r, 350));
    }
    busy(button, false);
  }

  function resetLayers() {
    L.items.forEach((item) => { item.dx = item.dy = 0; placeLayer(item); setHidden(item, false); });
  }

  $('ldl-image').addEventListener('click', downloadComposite);
  $('ldl-layer').addEventListener('click', async () => {
    if (L.sel < 0) return;
    const button = $('ldl-layer');
    busy(button, true);
    await download(L.items[L.sel].image);
    busy(button, false);
    button.disabled = L.sel < 0;
  });
  $('ldl-all').addEventListener('click', downloadAll);
  $('lreset').addEventListener('click', resetLayers);
  document.addEventListener('keydown', (event) => {
    if (!L.on || L.sel < 0 || event.target.tagName === 'INPUT') return;
    const item = L.items[L.sel];
    const step = event.shiftKey ? 0.05 : 0.005;
    const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
    if (move && item.i > 0) { event.preventDefault(); nudge(item, item.dx + move[0], item.dy + move[1]); }
    else if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); setHidden(item, true); }
  });

  // ---- wiring ----
  tools.querySelectorAll('[data-tool]').forEach((button) => button.addEventListener('click', () => setTool(button.dataset.tool)));
  $('cancel').addEventListener('click', () => setTool(null));
  $('close').addEventListener('click', () => closeEditor());
  $('send').addEventListener('click', sendTool);
  $('apply').addEventListener('click', applyEdit);
  editBox.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.isComposing) applyEdit(); });
  $('save').addEventListener('click', () => download(current()));
  $('vary').addEventListener('click', () => say('Make 3 variations of this image', 'Make 3 variations of ' + refer() + '.'));
  $('removebg').addEventListener('click', () => say('Remove the background of this image', 'Remove the background from ' + refer() + '. Keep the subject exactly as it is and give me a PNG with a transparent background.'));
  $('undo').addEventListener('click', () => {
    if (state.tool === 'comment') {
      const pin = state.pins.pop();
      if (pin) { pin.dot.remove(); pin.note.remove(); }
    } else {
      state.strokes.pop();
      redraw();
    }
    refreshToolbar();
  });
  $('resize').addEventListener('click', () => {
    sizes.hidden = !sizes.hidden;
    $('resize').setAttribute('aria-expanded', String(!sizes.hidden));
  });
  sizes.querySelectorAll('button').forEach((button) => button.addEventListener('click', () =>
    say('Resize this image to ' + button.dataset.ratio + ' (' + button.dataset.name + ')', 'Resize ' + refer() + ' to ' + button.dataset.ratio + ' (' + button.dataset.name + '). Keep the scene and extend or recompose it to fit the new shape.')));
  document.addEventListener('keydown', (event) => {
    if (state.editing && !state.tool && event.target.tagName !== 'INPUT' && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) return page(event.key === 'ArrowRight' ? 1 : -1);
    if (event.key !== 'Escape' || !state.editing) return;
    if (!sizes.hidden) sizes.hidden = true;
    else if (state.tool) setTool(null);
    else closeEditor();
  });

  // ---- size reporting and start-up ----
  let lastHeight = 0;
  const reportSize = () => {
    const height = Math.ceil($('app').getBoundingClientRect().height);
    if (height === lastHeight) return;
    lastHeight = height;
    notify('ui/notifications/size-changed', { width: Math.ceil(document.documentElement.clientWidth), height });
  };
  // Watch the content itself: the root element's box follows the frame, not the content.
  new ResizeObserver(reportSize).observe($('app'));
  new MutationObserver(reportSize).observe($('app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class', 'style'] });

  fitPage();
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'tintloom', version: '0.8.11' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
  }, 10000)
    .then((res) => {
      // What the app says it supports, kept for error messages.
      state.caps = (res && res.hostCapabilities) || null;
      state.hostCaps = res && res.hostCapabilities ? Object.keys(res.hostCapabilities).join(',') || 'none' : 'not stated';
      if (res && res.hostInfo) state.hostCaps += ' / ' + (res.hostInfo.name || '') + ' ' + (res.hostInfo.version || '');
      applyContext(res && res.hostContext);
    })
    .catch(() => {})
    .finally(() => {
      notify('ui/notifications/initialized');
      reportSize();
      // A host may mount the card while the tool is still running yet send no input at all (or send it only once
      // the call returns). Without this the card stays blank and zero-height, so the host shows nothing. If neither
      // input nor result has come shortly after start-up, show the waiting dots; a result replaces them. A card
      // reopened from history gets its result at once, well inside this delay, and never flashes the dots.
      setTimeout(() => { if (!state.result && !state.args) { state.args = {}; showWaiting(); } }, 800);
    });
})();
</script>
</body>
</html>
