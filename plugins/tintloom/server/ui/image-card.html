<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const gallery = document.querySelector('.gallery'), layersBox = $('layers'), lstage = $('lstage'), lclip = $('lclip'), llist = $('llist');
  const thumbs = $('thumbs'), stage = $('stage'), errorBox = $('error'), meta = $('meta');
  const tools = $('tools'), toolbar = $('toolbar'), composer = $('composer'), editBox = $('editbox'), sizes = $('sizes');
  const ICON_DOWNLOAD = '<svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>';

  // ---- JSON-RPC over postMessage: this page is the client, the host app the server ----
  let nextId = 1;
  const waiting = new Map();
  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const notify = (method, params) => post(params ? { method, params } : { method });
  const request = (method, params = {}, timeoutMs = 60000) =>
    new Promise((resolve, reject) => {
      const id = nextId++;
      const timer = timeoutMs ? setTimeout(() => { waiting.delete(id); reject(new Error(method + ' timed out')); }, timeoutMs) : 0;
      waiting.set(id, { resolve, reject, timer });
      post({ id, method, params });
    });

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;
    if (msg.method) return onHostMessage(msg);
    const pending = waiting.get(msg.id);
    if (!pending) return;
    waiting.delete(msg.id);
    clearTimeout(pending.timer);
    msg.error ? pending.reject(new Error(msg.error.message || 'Request failed')) : pending.resolve(msg.result);
  });

  // ---- state ----
  const state = {
    args: null, result: null, selected: 0, modes: [], mode: 'inline', loaded: new Map(),
    editing: false, wentFull: false, inset: { top: 0, right: 0, bottom: 0, left: 0 }, tool: null, strokes: [], pins: [], canvas: null,
  };

  // The layer view: the base and each layer at its real place. Per layer: dx and dy (how far its middle was moved, as fractions of
  // the base), s (scale), r (degrees clockwise), fx (mirrored). L.order lists the layers' indexes from back to front.
  const L = { on: false, items: [], sel: -1, W: 0, H: 0, order: [] };

  // Whatever goes wrong while drawing, the card says so: an empty frame tells the user nothing.
  function problem(error) {
    const text = 'The image card hit a problem' + (error && error.message ? ': ' + error.message : '.') + (state.result && state.result.images && state.result.images[0] && state.result.images[0].path ? '\nThe image is saved at ' + state.result.images[0].path : '');
    try { showError(text); } catch (e) { stage.replaceChildren(); errorBox.textContent = text; errorBox.hidden = false; }
  }

  function onHostMessage(msg) {
    try { fromHost(msg); } catch (error) { problem(error); }
    // The app is listening now: make sure it has the card's size (see start-up).
    if (!state.heard || msg.method === 'ui/notifications/tool-result') { state.heard = true; reportSize(true); }
  }

  function fromHost(msg) {
    const p = msg.params || {};
    switch (msg.method) {
      case 'ui/notifications/tool-input':
      case 'ui/notifications/tool-input-partial':
        state.args = p.arguments || {};
        // generate_image with add_image only opens the drop zone: no dots, no polling for progress.
        if (state.args.add_image === true) { if (!state.result) showUpload(); break; }
        if (!state.result) {
          showWaiting();
          if (msg.method === 'ui/notifications/tool-input') watchProgress();
        }
        break;
      case 'ui/notifications/tool-result': showResult(p); break;
      case 'ui/notifications/tool-cancelled': showError('Stopped before the image was finished.'); break;
      case 'ui/notifications/host-context-changed': applyContext(p); break;
      case 'ui/resource-teardown':
      case 'ping':
        post({ id: msg.id, result: {} });
        break;
      default:
        if (msg.id !== undefined) post({ id: msg.id, error: { code: -32601, message: 'Method not found' } });
    }
  }

  function applyContext(ctx) {
    if (!ctx) return;
    const root = document.documentElement;
    if (ctx.theme === 'light' || ctx.theme === 'dark') root.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [name, value] of Object.entries(vars)) if (name.startsWith('--') && value) root.style.setProperty(name, value);
    const fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts && !$('hostfonts')) {
      const style = document.createElement('style');
      style.id = 'hostfonts';
      style.textContent = fonts;
      document.head.appendChild(style);
    }
    if (Array.isArray(ctx.availableDisplayModes)) state.modes = ctx.availableDisplayModes;
    // Where the app says how tall a card may be, the image stays inside that, with room for the line under it.
    const limit = ctx.containerDimensions && Number(ctx.containerDimensions.maxHeight || ctx.containerDimensions.height);
    if (ctx.containerDimensions) { state.fixedHeight = Number(ctx.containerDimensions.height) > 0; fitPage(); }
    if (limit > 0) root.style.setProperty('--cap', Math.max(200, Math.min(520, limit - 72)) + 'px');
    if (ctx.safeAreaInsets) {
      // Space the app covers with its own controls, such as its message box over the bottom of a full view.
      for (const side of ['top', 'right', 'bottom', 'left']) {
        state.inset[side] = Math.max(0, Number(ctx.safeAreaInsets[side]) || 0);
        document.documentElement.style.setProperty('--safe-' + side, state.inset[side] + 'px');
      }
    }
    if (ctx.platform) state.platform = ctx.platform;
    fitScreen(state.platform);
    if (ctx.displayMode) setMode(ctx.displayMode);
    else { showComposer(); fitFrame(); }
  }

  // In the conversation the app sizes the card to its content, so the card never scrolls itself:
  // a scrollbar that flashes up while the app catches up narrows the card and shifts everything.
  // On a phone the card may span the whole screen, edge to edge, and a tall image would fill it.
  function fitScreen(platform) {
    const narrow = window.innerWidth <= 520;
    const edgeToEdge = narrow && window.screen && window.innerWidth >= window.screen.width - 4;
    document.body.classList.toggle('bleed', Boolean(edgeToEdge));
    if (narrow && window.screen && window.screen.height && (platform === 'mobile' || edgeToEdge)) {
      const now = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cap')) || 520;
      document.documentElement.style.setProperty('--cap', Math.round(Math.max(240, Math.min(now, window.screen.height * 0.5))) + 'px');
    }
  }

  function fitPage() {
    document.documentElement.style.overflow = state.mode === 'fullscreen' || state.fixedHeight ? '' : 'hidden';
  }

  function setMode(mode) {
    const was = state.mode;
    state.mode = mode;
    document.body.classList.toggle('full', mode === 'fullscreen');
    fitPage();
    // The host closed the full view itself: leave the editor with it.
    if (was === 'fullscreen' && mode !== 'fullscreen' && state.editing && state.wentFull) closeEditor(true);
    showComposer();
    fitFrame();
  }

  // ---- rendering ----
  function ratioFromArgs(args) {
    const size = /^(\d+)x(\d+)$/i.exec((args && args.size) || '');
    if (size) return size[1] + ' / ' + size[2];
    const aspect = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec((args && args.aspect) || '');
    return aspect ? aspect[1] + ' / ' + aspect[2] : '1 / 1';
  }
  // Give a frame the shape of its image. The gallery follows the frame that is on show.
  function shape(frame, ratio) {
    if (typeof ratio === 'string') { const [w, h] = ratio.split('/').map(Number); ratio = w / h; }
    if (!(ratio > 0)) ratio = 1;
    frame.dataset.ratio = String(ratio);
    frame.style.setProperty('--ratio', String(ratio));
    frame.style.aspectRatio = String(ratio);
    if (stage.children.length < 2 || frame.classList.contains('current')) stage.style.setProperty('--ratio', String(ratio));
  }

  // ---- waiting: dots on a grid, lit by a chain of points that winds across the frame ----
  const STEPS_NEW = ['Sketching the composition', 'Painting it in', 'Adding detail', 'Finishing touches'];
  const STEPS_EDIT = ['Studying the image', 'Reworking it', 'Blending the change', 'Finishing touches'];
  const wait = { raf: 0, timer: 0, key: '', started: 0, poll: 0, run: '', got: new Map(), choice: 0 };

  function stopWaiting() {
    cancelAnimationFrame(wait.raf);
    clearInterval(wait.timer);
    clearInterval(wait.poll);
    wait.raf = wait.timer = wait.poll = 0;
    wait.key = '';
    $('status').hidden = true;
  }

  function setStatus(text) {
    const span = document.createElement('span');
    span.textContent = text;
    $('status').replaceChildren(span);
    $('status').hidden = false;
  }

  /** A CSS variable as a plain colour the canvas can use (variables may hold light-dark() or other variables). */
  const probe = document.createElement('span');
  probe.style.display = 'none';
  function resolved(name) {
    if (!probe.isConnected) document.body.appendChild(probe);
    probe.style.color = 'var(' + name + ')';
    return getComputedStyle(probe).color || '';
  }

  function drawDots(canvas, seconds, phase) {
    const box = canvas.getBoundingClientRect();
    if (!box.width) return;
    const scale = window.devicePixelRatio || 1;
    const w = Math.round(box.width * scale), h = Math.round(box.height * scale);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const style = getComputedStyle(document.documentElement);
    const accent = resolved('--accent') || '#d2ff1f';
    const base = resolved('--text-3') || '#87867f';
    const gap = 15 * scale;
    const cols = Math.max(2, Math.floor(w / gap)), rows = Math.max(2, Math.floor(h / gap));
    const ox = (w - (cols - 1) * gap) / 2, oy = (h - (rows - 1) * gap) / 2;
    // The chain: where the head is now, and where it was at each earlier moment.
    const links = [];
    for (let k = 0; k < 26; k++) {
      const t = seconds * 0.9 - k * 0.11 + phase;
      links.push([w * (0.5 + 0.4 * Math.sin(t * 0.83) * Math.cos(t * 0.31)), h * (0.5 + 0.38 * Math.sin(t * 1.17 + 1.3)), 1 - k / 26]);
    }
    const reach = Math.min(w, h) * 0.13;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = ox + c * gap, y = oy + r * gap;
        let lit = 0;
        for (const [lx, ly, strength] of links) {
          const d2 = ((x - lx) * (x - lx) + (y - ly) * (y - ly)) / (reach * reach);
          if (d2 < 4) lit = Math.max(lit, strength * Math.exp(-d2 * 1.6));
        }
        ctx.globalAlpha = lit > 0.04 ? 0.3 + 0.7 * lit : 0.3;
        ctx.fillStyle = lit > 0.04 ? accent : base;
        ctx.beginPath();
        ctx.arc(x, y, (0.75 + 2.5 * lit) * scale, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function useGallery(on) {
    $('upload').hidden = true;
    gallery.hidden = !on;
    layersBox.hidden = on;
    L.on = !on;
    state.layerView = L.on;
    if (on) L.sel = -1;
    editBox.placeholder = on ? 'Describe edits' : 'Describe edits to this layer';
    showComposer();
  }

  function showWaiting() {
    useGallery(true);
    errorBox.hidden = true;
    const count = 1; // one large box however many images are coming
    const total = progressTotal(state.args || {});
    const editing = Boolean(state.args && state.args.images && state.args.images.length);
    const ratio = ratioFromArgs(state.args);
    const key = total + '|' + ratio + '|' + editing;
    if (wait.key === key) return; // already showing this; streamed input must not restart it
    stopWaiting();
    wait.key = key;
    wait.started = performance.now();
    wait.run = '';
    wait.got = new Map();
    wait.choice = 0;
    // A slot per image on its way, filled in as each one is ready.
    thumbs.replaceChildren();
    thumbs.hidden = total < 2;
    for (let i = 0; i < total && total > 1; i++) {
      const slot = document.createElement('button');
      slot.type = 'button';
      slot.className = 'pending';
      slot.disabled = true;
      slot.setAttribute('aria-label', 'Image ' + (i + 1) + ' of ' + total + ', on its way');
      slot.appendChild(document.createElement('img')).alt = '';
      slot.addEventListener('click', () => showEarly(i));
      thumbs.appendChild(slot);
    }
    stage.className = 'stage' + (count > 1 ? ' many' : '');
    stage.replaceChildren();
    const canvases = [];
    for (let i = 0; i < count; i++) {
      const frame = document.createElement('div');
      frame.className = 'frame wait';
      stage.appendChild(frame);
      shape(frame, ratio);
      const canvas = document.createElement('canvas');
      canvas.className = 'dots';
      canvas.setAttribute('aria-hidden', 'true');
      frame.appendChild(canvas);
      canvases.push(canvas);
    }
    const steps = editing ? STEPS_EDIT : STEPS_NEW;
    let step = 0;
    setStatus(steps[0]);
    wait.timer = setInterval(() => { if (step < steps.length - 1) setStatus(steps[++step]); }, 5500);
    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = () => {
      const seconds = still ? 1.2 : (performance.now() - wait.started) / 1000;
      canvases.forEach((canvas, i) => drawDots(canvas, seconds, i * 1.7));
      if (!still) wait.raf = requestAnimationFrame(tick);
    };
    wait.raf = requestAnimationFrame(tick);
  }

  // ---- images of a running call, shown as each one is ready ----
  // Same sums as the server: how many images a call makes, and the name it files progress under.
  function progressList(args) {
    return Array.isArray(args.prompts) ? args.prompts.filter((p) => typeof p === 'string' && p.trim()).slice(0, 4) : [];
  }
  function progressTotal(args) {
    const list = progressList(args);
    return list.length > 1 ? list.length : Math.min(Math.max(Math.floor(Number(args.count)) || 1, 1), 4);
  }
  function progressKey(args) {
    const list = progressList(args);
    const text = (list.length > 1 ? list : [String(args.prompt || '')]).join('\u0001') + '|' + progressTotal(args);
    let hash = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 0x01000193) >>> 0;
    return 'p' + hash.toString(16) + text.length.toString(16);
  }

  function watchProgress() {
    const args = state.args || {};
    const total = progressTotal(args);
    if (wait.poll || total < 2 || (state.caps && !state.caps.serverTools)) return;
    const key = progressKey(args);
    let busy = false;
    wait.poll = setInterval(async () => {
      if (busy || state.result) return;
      busy = true;
      try {
        const res = await request('tools/call', { name: 'get_progress', arguments: { key } }, 8000);
        const info = res && res.structuredContent;
        if (info && info.run && Array.isArray(info.images) && !state.result) {
          if (info.run !== wait.run) {
            // A different call than the one seen before (the same request, asked again): start the slots over.
            wait.run = info.run;
            wait.got = new Map();
            [...thumbs.children].forEach((slot) => { slot.className = 'pending'; slot.disabled = true; slot.firstChild.removeAttribute('src'); });
            const old = stage.querySelector('img.early');
            if (old) old.remove();
          }
          info.images.forEach((image) => { if (!wait.got.has(image.index)) arrived(image); });
        }
      } catch (e) { /* the app does not pass tool calls on: the images simply appear together at the end */ }
      busy = false;
    }, 2000);
  }

  async function arrived(image) {
    const slot = thumbs.children[image.index];
    if (!slot) return;
    wait.got.set(image.index, image);
    const run = wait.run;
    try {
      const src = image.src ? await tryImage(slot.firstChild, image.src) : await fetchImage(image.id).then((uri) => tryImage(slot.firstChild, uri));
      if (run !== wait.run || state.result) return;
      image.loaded = src;
      slot.className = '';
      slot.disabled = false;
      slot.setAttribute('aria-label', 'Image ' + (image.index + 1) + ', ready');
      clearInterval(wait.timer);
      const ready = [...wait.got.values()].filter((i) => i.loaded).length;
      setStatus(ready + ' of ' + thumbs.children.length + ' ready');
      if (!stage.querySelector('img.early')) showEarly(image.index);
    } catch (e) {
      wait.got.delete(image.index); // try again on the next round
    }
  }

  // Put a finished image in the large box while the others are still being made.
  function showEarly(index) {
    const image = wait.got.get(index);
    const frame = stage.firstElementChild;
    if (!image || !image.loaded || !frame || state.result) return;
    let img = frame.querySelector('img.early');
    if (!img) {
      img = document.createElement('img');
      img.className = 'early';
      img.alt = '';
      img.draggable = false;
      img.addEventListener('load', () => { if (img.naturalWidth) shape(frame, img.naturalWidth / img.naturalHeight); });
      frame.appendChild(img);
    }
    img.src = image.loaded;
    wait.choice = index;
    [...thumbs.children].forEach((el, i) => el.setAttribute('aria-pressed', String(i === index)));
  }

  /** Out of credits: say so, with one button to the upgrade page on the website (a plan, or a one-time top-up). */
  function showBilling(billing) {
    stopWaiting();
    useGallery(true);
    closeEditor(true);
    meta.hidden = true;
    errorBox.hidden = true;
    const box = document.createElement('div');
    box.className = 'billing';
    const title = document.createElement('strong');
    title.textContent = billing.balance > 0 ? 'Not enough credits for this image' : 'Out of credits';
    const detail = document.createElement('span');
    detail.textContent = 'This needs ' + billing.needed + (billing.needed === 1 ? ' credit' : ' credits') + '. You have ' + billing.balance + '.';
    const go = document.createElement('button');
    go.type = 'button';
    go.textContent = 'Add credits';
    go.addEventListener('click', () => request('ui/open-link', { url: billing.url }).catch(() => {}));
    box.append(title, detail, go);
    stage.replaceChildren(box);
  }

  function showError(text) {
    stopWaiting();
    useGallery(true);
    closeEditor(true);
    stage.replaceChildren();
    meta.hidden = true;
    errorBox.textContent = text;
    errorBox.hidden = false;
  }

  function showResult(result) {
    // open_image: no picture yet, the user adds theirs here.
    if (result && result.structuredContent && result.structuredContent.upload === 'open') return showUpload(result.structuredContent);
    // The data rides in two places: the result's structuredContent, and as JSON in its text. An app that replays a result
    // after a reload may keep only one of them, or a trimmed copy of the first, so both are read and the fuller one is used.
    let structured = result && result.structuredContent && Array.isArray(result.structuredContent.images) ? result.structuredContent : null;
    let fromText = null;
    for (const part of (result && result.content) || []) {
      if (fromText || part.type !== 'text' || typeof part.text !== 'string') continue;
      const marked = part.text.lastIndexOf('tintloom-card:');
      const candidates = marked >= 0 ? [part.text.slice(marked + 14), part.text] : [part.text];
      for (const text of candidates) {
        try {
          const parsed = JSON.parse(text);
          if (parsed && Array.isArray(parsed.images)) { fromText = parsed; break; }
        } catch (e) { /* not JSON */ }
      }
    }
    const richness = (d) => (d ? (d.layers === true ? 1000 : 0) + d.images.filter((i) => i && i.box).length + (d.images.some((i) => i && i.name) ? 1 : 0) : -1);
    let data = fromText && richness(fromText) > richness(structured) ? fromText : structured || fromText;
    if (result && result.isError && result.structuredContent && result.structuredContent.billing) return showBilling(result.structuredContent.billing);
    if (result && result.isError) {
      const text = (result.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
      return showError(text || 'The image could not be made.');
    }
    if (!data || !Array.isArray(data.images) || !data.images.length) {
      // Say exactly what did arrive, so the cause can be read off a screenshot.
      const got = result ? Object.keys(result).map((k) => k + (k === 'content' && Array.isArray(result.content) ? '[' + result.content.map((c) => c.type + ':' + String(c.text || '').length).join(',') + ']' : '')).join(', ') : 'nothing';
      const sample = (((result && result.content) || []).find((c) => c.type === 'text') || {}).text || '';
      return showError('No image came back.\n(received: ' + got + ')\n' + sample.slice(0, 220));
    }
    // A split into layers reloaded with less than it had (no layer data in what the app replays): ask the server for the set
    // by id. The tool's own input, or the words of the result, say it was a split; an ordinary gallery is not asked about.
    const wasSplit = data.layers !== true && ((state.args && state.args.layers === true) || (result.content || []).some((c) => c && c.type === 'text' && /^Split the image into \d+ layers/.test(c.text || '')));
    if (wasSplit && !(state.caps && !state.caps.serverTools)) {
      stage.replaceChildren();
      setStatus('Opening the layers');
      request('tools/call', { name: 'get_layer_set', arguments: { id: data.images[0].id } }, 15000)
        .then((res) => (res && res.structuredContent && res.structuredContent.set) || null, () => null)
        .then((set) => showResultData(set && Array.isArray(set.images) ? set : data, result));
      return;
    }
    return showResultData(data, result);
  }

  function showResultData(data, result) {
    stopWaiting();
    // A layer set that cannot be drawn as layers (no places for them) never shows the bare base, which is only the
    // background, as its main picture: the picture that was split comes first, then the layers.
    if (data.layers === true && !layersUsable(data)) {
      const [base, ...layers] = data.images;
      const original = data.original && data.original.id ? { id: data.original.id, mime: data.original.mime || 'image/png', name: 'Original' } : null;
      data = { ...data, images: original ? [original, ...layers] : layers.length ? layers : [base] };
    }
    state.result = data;
    state.selected = 0;
    errorBox.hidden = true;
    if (data.layers === true && layersUsable(data)) return showLayers(data, result);
    useGallery(true);

    const many = data.images.length > 1;
    stage.className = 'stage' + (many ? ' many' : '');
    stage.replaceChildren();
    thumbs.replaceChildren();
    thumbs.hidden = !many;
    data.images.forEach((image, index) => {
      const frame = document.createElement('div');
      frame.className = 'frame' + ((state.args && state.args.background === 'transparent') || image.transparent ? ' transparent' : '');
      frame.tabIndex = 0;
      frame.setAttribute('role', 'button');
      frame.setAttribute('aria-label', (many ? (image.name || 'Image ' + (index + 1)) + ', ' + (index + 1) + ' of ' + data.images.length : 'Generated image') + '. Open editor');
      const img = document.createElement('img');
      img.alt = image.prompt || data.prompt || 'Generated image';
      img.decoding = 'async';
      img.draggable = false;
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'on-image left';
      edit.textContent = 'Edit';
      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'on-image right';
      save.setAttribute('aria-label', 'Download');
      save.innerHTML = ICON_DOWNLOAD;
      save.addEventListener('click', (event) => { event.stopPropagation(); download(image); });
      frame.append(img, edit, save);
      if (image.name) {
        const tag = document.createElement('span');
        tag.className = 'layer-name';
        tag.textContent = image.name;
        frame.appendChild(tag);
      }
      const open = () => { if (!state.editing) openEditor(index); };
      frame.addEventListener('click', open);
      frame.addEventListener('keydown', (event) => { if (event.target === frame && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); open(); } });
      stage.appendChild(frame);
      shape(frame, ratioFromArgs(state.args));
      if (many) {
        const pick = document.createElement('button');
        pick.type = 'button';
        pick.setAttribute('aria-label', (image.name || 'Image ' + (index + 1)) + ', ' + (index + 1) + ' of ' + data.images.length);
        pick.title = image.name || image.prompt || '';
        pick.className = 'pending';
        const small = document.createElement('img');
        small.alt = '';
        small.draggable = false;
        img.addEventListener('load', () => { small.src = img.src; pick.className = ''; });
        pick.appendChild(small);
        pick.addEventListener('click', () => choose(index));
        thumbs.appendChild(pick);
      }
      const pick = many ? thumbs.lastElementChild : null;
      const failed = (why) => { if (pick) pick.className = 'failed'; if (why) cannotShow(frame, image, [why && why.message ? why.message : 'failed']); };
      let quick = null;
      try { quick = quickCopy(result, image, index); } catch (e) { /* no inline copy: the other routes are tried */ }
      loadInto(image, img, frame, quick).then((ok) => { if (!ok) failed(); }, failed);
    });
    choose(Math.min(wait.choice || 0, data.images.length - 1));

    const facts = [data.providerLabel || data.provider, data.model];
    if (data.seconds) facts.push(data.seconds + 's');
    // The balance is only mentioned once it is running low.
    if (data.credits && data.credits.left <= 10) facts.push(data.credits.left + (data.credits.left === 1 ? ' credit left' : ' credits left'));
    const first = data.images[0];
    if (first.path) facts.push('Saved to ' + (first.shown || first.path) + (many ? ' and ' + (data.images.length - 1) + ' more' : ''));
    meta.textContent = facts.filter(Boolean).join(' · ');
    // Running low: one small button to the upgrade page (data.credits.url).
    if (data.credits && data.credits.left <= 10 && data.credits.url) {
      const topup = document.createElement('button');
      topup.type = 'button';
      topup.className = 'topup';
      topup.textContent = 'Add credits';
      topup.addEventListener('click', () => request('ui/open-link', { url: data.credits.url }).catch(() => {}));
      meta.append(' ', topup);
    }
    meta.title = first.path || '';
    meta.hidden = false;
  }

  // Which of several images is shown large (and edited).
  function choose(index) {
    state.selected = index;
    [...stage.children].forEach((el, i) => el.classList.toggle('current', i === index));
    [...thumbs.children].forEach((el, i) => el.setAttribute('aria-pressed', String(i === index)));
    const shown = stage.children[index];
    if (shown && shown.dataset.ratio) stage.style.setProperty('--ratio', shown.dataset.ratio);
    refreshPager();
  }

  function refreshPager() {
    const pager = $('pager');
    const count = state.result ? state.result.images.length : 0;
    pager.hidden = !(state.editing && !state.tool && count > 1);
    if (pager.hidden) return;
    if (pager.children.length !== count) {
      pager.replaceChildren(...Array.from({ length: count }, (_, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', 'Image ' + (i + 1) + ' of ' + count);
        dot.addEventListener('click', () => page(i - state.selected));
        return dot;
      }));
    }
    [...pager.children].forEach((el, i) => el.setAttribute('aria-pressed', String(i === state.selected)));
  }

  // Move to the next or previous image while the editor is open.
  function page(step) {
    const count = state.result ? state.result.images.length : 0;
    const to = state.selected + step;
    if (!state.editing || state.tool || !step || to < 0 || to >= count) return;
    setZoom(1, 0, 0);
    choose(to);
    fitFrame();
  }

  // Large images come in pieces: apps cap the size of a single message.
  async function fetchImage(id, edge) {
    let data = '', mime = 'image/png';
    for (let offset = 0, guard = 0; guard < 80; guard++) {
      const res = await request('tools/call', { name: 'get_generated_image', arguments: { id, offset, ...(edge && { edge }) } }, 30000);
      if (!res) throw new Error('empty reply');
      if (res.isError) throw new Error(((res.content || []).find((c) => c.type === 'text') || {}).text || 'tool error');
      const info = res.structuredContent;
      if (!info || typeof info.chunk !== 'string') {
        // An older server: the whole image in one image part.
        const part = (res.content || []).find((c) => c.type === 'image');
        if (!part) throw new Error('reply had no image: ' + Object.keys(res).join(','));
        return 'data:' + part.mimeType + ';base64,' + part.data;
      }
      data += info.chunk;
      mime = info.mime || mime;
      offset += info.chunk.length;
      if (offset >= info.total || !info.chunk.length) break;
    }
    return 'data:' + mime + ';base64,' + data;
  }

  const tryImage = (img, src, limit = 45000) => new Promise((resolve, reject) => {
    const probe = new Image();
    const timer = setTimeout(() => { probe.onload = probe.onerror = null; probe.src = ''; reject(new Error('timed out')); }, limit);
    probe.onload = () => { clearTimeout(timer); img.src = src; resolve(src); };
    probe.onerror = () => { clearTimeout(timer); reject(new Error('could not load')); };
    probe.src = src;
  });

  // A copy of the picture that came with the result itself, so it needs nothing from the app:
  // the image the model was given, else a preview or thumbnail the server made.
  function quickCopy(result, image, index) {
    const content = Array.isArray(result.content) ? result.content : [];
    // An image part as the server sent it ({ data, mimeType }), or as an app that stores results keeps it ({ source: { data, media_type } }).
    const pictures = content.map((c) => (!c || c.type !== 'image' ? null : c.data ? { data: c.data, mimeType: c.mimeType } : c.source && c.source.data ? { data: c.source.data, mimeType: c.source.media_type || c.source.mediaType } : null)).filter(Boolean);
    // `pic` says which of the result's image parts is this image's copy. It is trusted only when
    // the app passed on exactly the image parts the server sent.
    const block = Number.isInteger(image.pic)
      ? (pictures.length === state.result.pics ? pictures[image.pic] : null)
      : pictures.length === state.result.images.length ? pictures[index] : null;
    if (block) return { name: 'copy', src: 'data:' + (block.mimeType || 'image/png') + ';base64,' + block.data };
    const previews = result._meta && result._meta['tintloom/previews'];
    if (previews && previews[image.id]) return { name: 'preview', src: previews[image.id] };
    return image.thumb ? { name: 'thumb', src: image.thumb } : null;
  }

  // The copy that came with the result goes up at once; the full image replaces it when a route to it works.
  // Apps differ in which routes they allow, and a phone on a slow line may wait a while for the full one.
  async function loadInto(image, img, frame, quick) {
    const show = () => {
      if (!img.naturalWidth) return;
      shape(frame, img.naturalWidth / img.naturalHeight);
      img.classList.add('ready');
      fitFrame();
    };
    img.addEventListener('load', show);
    const reasons = [];
    let shown = false;
    if (quick) {
      try {
        state.loaded.set(image.id, await tryImage(img, quick.src, 10000));
        state.route = quick.name;
        shown = true;
      } catch (e) {
        reasons.push(quick.name + ': ' + (e && e.message ? e.message : 'failed'));
      }
    }
    const routes = [
      ['link', () => (image.src ? tryImage(img, image.src, shown ? 90000 : 30000) : Promise.reject(new Error('none')))],
      ['fetch', () => (state.caps && !state.caps.serverTools ? Promise.reject(new Error('app does not offer tool calls')) : fetchImage(image.id).then((uri) => tryImage(img, uri)))],
    ];
    for (const [name, route] of routes) {
      try {
        state.loaded.set(image.id, await route());
        state.route = name;
        return true;
      } catch (e) {
        reasons.push(name + ': ' + (e && e.message ? e.message : 'failed'));
      }
    }
    if (shown) {
      // A reduced copy is on screen: say so, and where the real one is.
      const note = ' · preview shown' + (image.path ? ', full quality in the file' : '');
      if (!meta.textContent.includes(note)) meta.textContent += note;
      meta.title = reasons.join('; ');
      return true;
    }
    cannotShow(frame, image, reasons);
    return false;
  }

  // No route to the picture worked: say where it is, and why, in place of an empty box.
  function cannotShow(frame, image, reasons) {
    frame.classList.add('failed');
    frame.style.aspectRatio = 'auto';
    frame.replaceChildren(document.createTextNode(image && image.path ? 'The image is saved at ' + (image.shown || image.path) + ', but this app could not show it here.' : 'The image was made, but this app could not show it here.'));
    const why = document.createElement('div');
    why.style.cssText = 'font-size:12px;opacity:.7;margin-top:6px';
    why.textContent = '(' + reasons.join('; ') + ')';
    frame.appendChild(why);
  }

  // ---- messages back to the conversation ----
  const current = () => state.result.images[state.selected];
  const currentFrame = () => stage.children[state.selected];
  const refer = () => 'this image (id ' + current().id + ')';
  // Post a request into the conversation. Apps differ on the message shape, so try both,
  // and if neither is accepted hand the user the words (copied, where the app allows).
  // `short` is what the user would have typed. It is enough when the server has been told which
  // image is open and what was painted on it; otherwise `long` spells that out in the message.
  async function say(short, long, selection) {
    const image = current().id;
    closeEditor();
    let text = long || short;
    if (!(state.caps && !state.caps.serverTools)) {
      try {
        const res = await request('tools/call', { name: 'save_selection', arguments: { image, ...(selection || {}) } }, 8000);
        if (res && !res.isError && res.structuredContent && res.structuredContent.saved) text = short;
      } catch (e) { /* the app does not pass tool calls on: the long form carries the details */ }
    }
    const reasons0 = [];
    // The protocol's shape is a list of content blocks; the single-object form is only for older apps.
    const shapes = [[{ type: 'text', text }], { type: 'text', text }];
    if (state.caps && !state.caps.message) reasons0.push('app does not offer messages');
    const reasons = reasons0;
    for (const content of shapes) {
      try {
        const res = await request('ui/message', { role: 'user', content }, 20000);
        if (!res || !res.isError) return;
        reasons.push('refused');
      } catch (e) {
        reasons.push(e && e.message ? e.message : 'failed');
      }
    }
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (e) { /* the app does not allow the clipboard either */ }
    errorBox.textContent = (copied ? 'This app does not let the card send requests. It is copied: paste it into the chat.' : 'This app does not let the card send requests. Paste this into the chat:') +
      '\n' + text + '\n(' + reasons.join('; ') + '; host: ' + (state.hostCaps || 'unknown') + ')';
    errorBox.hidden = false;
  }

  async function download(image) {
    const name = (image.path || (image.name ? image.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() : 'image')).split('/').pop().replace(/\.[a-z0-9]+$/i, '') + '.' + ((image.mime || 'image/png').split('/')[1] || 'png').replace('jpeg', 'jpg');
    const link0 = image.url || image.src;
    if (state.caps && state.caps.downloadFile) {
      const target = image.url || (image.path ? 'file://' + encodeURI(image.path) : link0);
      if (target) {
        return request('ui/download-file', { contents: [{ type: 'resource_link', uri: target, name, mimeType: image.mime || 'image/png' }] })
          .then((res) => { if (res && res.isError) throw new Error('refused'); })
          .catch(() => (link0 ? request('ui/open-link', { url: link0 }).catch(() => {}) : undefined));
      }
    }
    if (link0) return request('ui/open-link', { url: link0 }).catch(() => {});
    const uri = L.on ? await fetchImage(image.id).catch(() => null) : state.loaded.get(image.id);
    if (!uri) return;
    const link = document.createElement('a');
    link.href = uri;
    link.download = 'image.' + ((image.mime || 'image/png').split('/')[1] || 'png').replace('jpeg', 'jpg');
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  // ---- editor ----
  async function openEditor(index) {
    state.selected = index;
    state.editing = true;
    [...stage.children].forEach((el, i) => el.classList.toggle('current', i === index));
    document.body.classList.add('editing');
    setTool(null);
    state.wentFull = false;
    if (state.modes.includes('fullscreen') && state.mode !== 'fullscreen') {
      try {
        const res = await request('ui/request-display-mode', { mode: 'fullscreen' });
        state.wentFull = (res && res.mode) === 'fullscreen';
        if (state.wentFull) setMode('fullscreen');
      } catch (e) { /* the host declined; edit in place */ }
    }
    refreshPager();
    fitFrame();
  }

  function closeEditor(keepMode) {
    if (!state.editing) return;
    setTool(null);
    state.editing = false;
    setZoom(1, 0, 0);
    refreshPager();
    document.body.classList.remove('editing');
    tools.hidden = true;
    toolbar.hidden = true;
    composer.hidden = true;
    editBox.value = '';
    [...stage.children].forEach((el, i) => { el.classList.toggle('current', i === state.selected); el.style.maxWidth = ''; });
    if (state.wentFull && !keepMode) {
      state.wentFull = false;
      request('ui/request-display-mode', { mode: 'inline' }).then((res) => setMode((res && res.mode) || 'inline')).catch(() => setMode('inline'));
    }
    state.wentFull = false;
  }

  // In the full view the image grows to fill the height left over by the controls.
  function fitFrame() {
    if (!state.editing) return;
    const frame = currentFrame();
    const ratio = Number(frame && frame.dataset.ratio) || 1;
    frame.style.maxWidth = state.mode === 'fullscreen' ? 'min(100%, calc((100vh - ' + (170 + state.inset.top + state.inset.bottom) + 'px) * ' + ratio + '))' : '';
    requestAnimationFrame(() => { setZoom(zoom.z, zoom.x, zoom.y); redraw(); });
  }
  window.addEventListener('resize', () => { fitScreen(state.platform); fitFrame(); });

  const TIPS = {
    select: 'Paint over the part to change, then describe the edit',
    erase: 'Paint over what to remove',
    comment: 'Click on the image to add comments',
  };

  // The card's own message box. In a full view where the app keeps its message box on top
  // (it reports the covered space), that box does the describing, and ours shows only for
  // a painted selection, which the app's box cannot carry.
  function showComposer() {
    if (L.on) { composer.hidden = L.sel < 0; return; }
    const appBox = state.mode === 'fullscreen' && state.inset.bottom >= 40;
    composer.hidden = !state.editing || state.tool === 'erase' || state.tool === 'comment' || (appBox && state.tool !== 'select');
  }

  function setTool(tool) {
    const frame = state.result ? currentFrame() : null;
    if (frame) frame.querySelectorAll('canvas.paint, .pin, .note').forEach((el) => el.remove());
    state.tool = tool;
    state.strokes = [];
    state.pins = [];
    state.canvas = null;
    document.body.classList.toggle('tool-paint', tool === 'select' || tool === 'erase');
    document.body.classList.toggle('tool-comment', tool === 'comment');
    sizes.hidden = true;
    if (!state.editing) return;
    tools.hidden = Boolean(tool);
    toolbar.hidden = !tool;
    refreshPager();
    showComposer();
    editBox.placeholder = tool === 'select' ? 'Describe the change for the selected area' : 'Describe edits';
    if (!tool) return;
    $('tip').textContent = TIPS[tool];
    $('brush').hidden = tool === 'comment';
    $('send').hidden = tool === 'select';
    if (tool !== 'comment') {
      state.canvas = document.createElement('canvas');
      state.canvas.className = 'paint';
      frame.appendChild(state.canvas);
      redraw();
    }
    refreshToolbar();
  }

  function refreshToolbar() {
    const empty = state.tool === 'comment' ? !state.pins.some((p) => p.text.trim()) : !state.strokes.length;
    $('send').disabled = empty;
    $('undo').disabled = state.tool === 'comment' ? !state.pins.length : !state.strokes.length;
  }

  // Strokes are kept in image fractions, so they redraw at any size and export at full resolution.
  function drawStrokes(ctx, width, height) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--paint').trim() || '#2c84db';
    for (const stroke of state.strokes) {
      ctx.lineWidth = stroke.size * width;
      ctx.beginPath();
      stroke.points.forEach(([x, y], i) => (i ? ctx.lineTo(x * width, y * height) : ctx.moveTo(x * width, y * height)));
      if (stroke.points.length === 1) ctx.lineTo(stroke.points[0][0] * width + 0.01, stroke.points[0][1] * height);
      ctx.stroke();
    }
  }

  function redraw() {
    const canvas = state.canvas;
    if (!canvas) return;
    const box = canvas.getBoundingClientRect();
    const scale = Math.min((window.devicePixelRatio || 1) * zoom.z, 4) / zoom.z;
    canvas.width = Math.max(1, Math.round(box.width * scale));
    canvas.height = Math.max(1, Math.round(box.height * scale));
    drawStrokes(canvas.getContext('2d'), canvas.width, canvas.height);
  }

  const pointIn = (frame, event) => {
    const box = frame.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (event.clientX - box.left) / box.width)), Math.min(1, Math.max(0, (event.clientY - box.top) / box.height))];
  };

  let drawing = null;
  stage.addEventListener('pointerdown', (event) => {
    if (!state.editing || !state.tool || event.button > 0) return;
    const frame = currentFrame();
    if (!frame.contains(event.target)) return;
    if (state.tool === 'comment') {
      if (event.target.closest('.pin, .note') || touches.size > 1) return;
      event.preventDefault();
      return addPin(frame, pointIn(frame, event));
    }
    event.preventDefault();
    if (touches.size > 1) return; // a second finger is a pinch
    drawing = { size: Number($('brush').value) / 100 / zoom.z, points: [pointIn(frame, event)] };
    state.strokes.push(drawing);
    try { frame.setPointerCapture(event.pointerId); } catch (e) { /* not capturable: moves inside the frame still draw */ }
    redraw();
  });
  stage.addEventListener('pointermove', (event) => {
    if (!drawing) return;
    drawing.points.push(pointIn(currentFrame(), event));
    redraw();
  });
  const endStroke = () => { if (drawing) { drawing = null; refreshToolbar(); } };
  stage.addEventListener('pointerup', endStroke);
  stage.addEventListener('pointercancel', endStroke);

  // ---- zoom: pinch with two fingers, drag to move, double-tap to jump in and out ----
  const zoom = { z: 1, x: 0, y: 0 };
  const touches = new Map();
  let pinch = null, pan = null, lastTap = null, swipe = null;
  function setZoom(z, x, y) {
    const frame = state.result ? currentFrame() : null;
    if (!frame) return;
    zoom.z = Math.min(5, Math.max(1, z));
    const on = state.editing && zoom.z > 1.02;
    if (!on) zoom.z = 1;
    zoom.x = on ? Math.min(0, Math.max(frame.offsetWidth * (1 - zoom.z), x)) : 0;
    zoom.y = on ? Math.min(0, Math.max(frame.offsetHeight * (1 - zoom.z), y)) : 0;
    [...stage.children].forEach((el) => { el.style.transform = ''; });
    if (on) frame.style.transform = 'translate(' + zoom.x + 'px, ' + zoom.y + 'px) scale(' + zoom.z + ')';
    stage.classList.toggle('zoomed', on);
  }
  // A point on the screen, measured from the image's corner as it sits unzoomed.
  const fromCorner = (frame, x, y) => {
    const box = frame.getBoundingClientRect();
    return [x - (box.left - zoom.x), y - (box.top - zoom.y)];
  };
  const zoomAt = (frame, x, y, z) => {
    const at = fromCorner(frame, x, y);
    const to = Math.min(5, Math.max(1, z));
    setZoom(to, at[0] - ((at[0] - zoom.x) / zoom.z) * to, at[1] - ((at[1] - zoom.y) / zoom.z) * to);
  };
  stage.addEventListener('pointerdown', (event) => {
    const frame = state.editing ? currentFrame() : null;
    if (!frame || !frame.contains(event.target) || event.target.closest('.note')) return;
    touches.set(event.pointerId, [event.clientX, event.clientY]);
    if (touches.size === 2) {
      // The first finger may have started a brush stroke: take it back.
      if (drawing) { state.strokes.pop(); drawing = null; refreshToolbar(); }
      const [a, b] = [...touches.values()];
      const mid = fromCorner(frame, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      pinch = { gap: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z: zoom.z, on: [(mid[0] - zoom.x) / zoom.z, (mid[1] - zoom.y) / zoom.z] };
      pan = null;
    } else if (touches.size === 1 && !state.tool && zoom.z > 1) {
      pan = { from: [event.clientX, event.clientY], x: zoom.x, y: zoom.y };
    } else if (touches.size === 1 && !state.tool) {
      swipe = [event.clientX, event.clientY];
    }
    if (touches.size > 1) swipe = null;
  }, true);
  stage.addEventListener('pointermove', (event) => {
    if (!touches.has(event.pointerId)) return;
    touches.set(event.pointerId, [event.clientX, event.clientY]);
    const frame = currentFrame();
    if (pinch && touches.size >= 2) {
      const [a, b] = [...touches.values()];
      const z = Math.min(5, Math.max(1, (pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1])) / pinch.gap));
      const mid = fromCorner(frame, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      setZoom(z, mid[0] - pinch.on[0] * z, mid[1] - pinch.on[1] * z);
    } else if (pan) {
      setZoom(zoom.z, pan.x + event.clientX - pan.from[0], pan.y + event.clientY - pan.from[1]);
    }
  }, true);
  const liftFinger = (event) => {
    if (!touches.delete(event.pointerId)) return;
    if (pinch && touches.size < 2) { pinch = null; redraw(); }
    const moved = pan && Math.hypot(event.clientX - pan.from[0], event.clientY - pan.from[1]) > 8;
    pan = null;
    // A sideways flick on an unzoomed image goes to the next or previous one.
    const across = swipe ? event.clientX - swipe[0] : 0, down = swipe ? event.clientY - swipe[1] : 0;
    swipe = null;
    if (event.type === 'pointerup' && Math.abs(across) > 40 && Math.abs(across) > Math.abs(down) * 1.5) return page(across < 0 ? 1 : -1);
    if (event.type !== 'pointerup' || state.tool || touches.size || moved) return;
    // Two quick taps in one place: zoom in there, or back out.
    const now = Date.now();
    if (lastTap && now - lastTap.at < 320 && Math.hypot(event.clientX - lastTap.x, event.clientY - lastTap.y) < 30) {
      lastTap = null;
      zoom.z > 1 ? setZoom(1, 0, 0) : zoomAt(currentFrame(), event.clientX, event.clientY, 2.5);
    } else lastTap = { at: now, x: event.clientX, y: event.clientY };
  };
  stage.addEventListener('pointerup', liftFinger, true);
  stage.addEventListener('pointercancel', liftFinger, true);
  // A trackpad pinch arrives as a wheel event with ctrl held.
  stage.addEventListener('wheel', (event) => {
    const frame = state.editing ? currentFrame() : null;
    if (!frame || !event.ctrlKey || !frame.contains(event.target)) return;
    event.preventDefault();
    zoomAt(frame, event.clientX, event.clientY, zoom.z * Math.exp(-event.deltaY * 0.01));
    redraw();
  }, { passive: false });

  function addPin(frame, [x, y]) {
    const pin = { x, y, text: '' };
    state.pins.push(pin);
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'pin';
    dot.textContent = String(state.pins.length);
    dot.style.left = x * 100 + '%';
    dot.style.top = y * 100 + '%';
    const note = document.createElement('input');
    note.type = 'text';
    note.className = 'note';
    note.placeholder = 'Add a comment…';
    note.setAttribute('aria-label', 'Comment ' + state.pins.length);
    note.style.top = 'calc(' + y * 100 + '% - 16px)';
    if (x > 0.55) note.style.right = 'calc(' + (1 - x) * 100 + '% + 18px)'; else note.style.left = 'calc(' + x * 100 + '% + 18px)';
    note.addEventListener('input', () => { pin.text = note.value; dot.title = note.value; refreshToolbar(); });
    note.addEventListener('keydown', (event) => { if (event.key === 'Enter') note.hidden = true; });
    dot.addEventListener('click', () => { note.hidden = !note.hidden; if (!note.hidden) note.focus(); });
    pin.dot = dot;
    pin.note = note;
    frame.querySelectorAll('.note').forEach((el) => { el.hidden = true; });
    frame.append(dot, note);
    setTimeout(() => note.focus(), 0);
    refreshToolbar();
  }

  // A mask the size of the image on show: opaque, transparent where the user painted. Base64 PNG.
  // For a change (not an erase) each stroke also opens the box around it: people brush across a thing
  // rather than colour it in, and the edit has to reach all of it.
  function maskData(boxes) {
    const img = currentFrame().querySelector('img');
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'destination-out';
    drawStrokes(ctx, canvas.width, canvas.height);
    if (boxes) for (const b of strokeRegions()) ctx.fillRect(b.x * canvas.width, b.y * canvas.height, b.width * canvas.width, b.height * canvas.height);
    return canvas.toDataURL('image/png').split(',')[1];
  }

  const percent = (v) => Math.round(v * 100) + '%';

  // The painted area as rectangles (fractions of the image), one per stroke.
  function strokeRegions() {
    const img = currentFrame().querySelector('img');
    const tall = (img.naturalWidth || 1) / (img.naturalHeight || 1);
    const round = (v) => Math.round(Math.min(1, Math.max(0, v)) * 1000) / 1000;
    return state.strokes.map((stroke) => {
      const xs = stroke.points.map((p) => p[0]), ys = stroke.points.map((p) => p[1]);
      const rx = stroke.size / 2, ry = (stroke.size / 2) * tall;
      const x = round(Math.min(...xs) - rx), y = round(Math.min(...ys) - ry);
      return { x, y, width: round(round(Math.max(...xs) + rx) - x), height: round(round(Math.max(...ys) + ry) - y) };
    });
  }

  // What was painted, for the server (a mask) and, where the app cannot reach it, for the message (rectangles).
  const painted = (erase) => ({ mask: maskData(!erase), regions: strokeRegions(), ...(erase && { erase: true }) });

  async function sendTool() {
    if (state.tool === 'comment') {
      const notes = state.pins.filter((p) => p.text.trim());
      if (!notes.length) return;
      const lines = notes.map((p, i) => (i + 1) + '. At ' + percent(p.x) + ' from the left, ' + percent(p.y) + ' from the top: ' + p.text.trim());
      return say('Edit this image:\n' + lines.join('\n'), 'Edit ' + refer() + ' with these changes, and keep everything else the same:\n' + lines.join('\n'));
    }
    if (!state.strokes.length) return;
    $('send').disabled = true;
    const area = painted(true);
    await say('Erase the selected area', 'Erase the selected area of ' + refer() + ' (edit_regions ' + JSON.stringify(area.regions) + ', erase true).', area);
  }

  async function applyEdit() {
    const change = editBox.value.trim();
    if (!change) return editBox.focus();
    if (state.tool === 'select' && state.strokes.length) {
      $('apply').disabled = true;
      const area = painted(false);
      await say('Change the selected area: ' + change, 'Edit ' + refer() + ', changing only the selected area (edit_regions ' + JSON.stringify(area.regions) + '): ' + change, area);
      $('apply').disabled = false;
      return;
    }
    if (L.on) {
      const name = current().name || 'layer';
      await say('Edit this layer (' + name + '): ' + change, 'Edit ' + refer() + ', the layer "' + name + '": ' + change);
      editBox.value = '';
      return;
    }
    say('Edit this image: ' + change, 'Edit ' + refer() + ': ' + change);
  }

  // ---- layers: composite, drag, hide, download ----
  const ICON_GRIP = '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="4.5" cy="2.5" r="1.3"/><circle cx="9.5" cy="2.5" r="1.3"/><circle cx="4.5" cy="7" r="1.3"/><circle cx="9.5" cy="7" r="1.3"/><circle cx="4.5" cy="11.5" r="1.3"/><circle cx="9.5" cy="11.5" r="1.3"/></svg>';
  const ICON_EYE = '<svg class="i" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_EYE_OFF = '<svg class="i" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
  const sizeOf = (text) => { const m = /^(\d+)x(\d+)$/.exec(text || ''); return m ? [Number(m[1]), Number(m[2])] : null; };
  const four = (list) => Array.isArray(list) && list.length === 4 && list.every((v) => Number.isFinite(Number(v)));

  /** Where a layer sits in the base, as [left, top, right, bottom] fractions; null when the result carries no usable box. */
  function layerBox(image) {
    const box = image && image.box;
    if (!box) return null;
    if (L.W && four(box.absolute)) { const a = box.absolute.map(Number); return [a[0] / L.W, a[1] / L.H, a[2] / L.W, a[3] / L.H]; }
    if (four(box.normalized)) return box.normalized.map((v) => Number(v) / 1000);
    return null;
  }

  /** A layer set is shown as layers only when the base and every layer say where they go; else it stays a gallery. */
  function layersUsable(data) {
    if (data.images.length < 2) return false;
    const size = sizeOf(data.images[0].size);
    return data.images.slice(1).every((image) => image.box && (four(image.box.normalized) || (size && four(image.box.absolute))));
  }

  function placeLayer(item) {
    if (item.i === 0) return;
    const b = layerBox(item.image);
    if (!b) return;
    const st = item.el.style;
    st.left = (b[0] + item.dx) * 100 + '%';
    st.top = (b[1] + item.dy) * 100 + '%';
    st.width = (b[2] - b[0]) * 100 + '%';
    st.height = (b[3] - b[1]) * 100 + '%';
    st.transform = item.r || item.s !== 1 || item.fx ? 'rotate(' + item.r + 'deg) scale(' + (item.fx ? -item.s : item.s) + ', ' + item.s + ')' : '';
  }

  // ---- the maths of a transformed layer on a stage of W by H pixels (web/lib/layer-types.ts has the same, for the dashboard) ----
  const SCALE_MIN = 0.05, SCALE_MAX = 10;
  const normDeg = (r) => { const x = ((r % 360) + 360) % 360; return x > 180 ? x - 360 : x; };
  function geometry(b, t, W, H) {
    const cx = ((b[0] + b[2]) / 2 + t.dx) * W, cy = ((b[1] + b[3]) / 2 + t.dy) * H;
    const w = (b[2] - b[0]) * W * t.s, h = (b[3] - b[1]) * H * t.s;
    const a = (t.r * Math.PI) / 180, co = Math.cos(a), si = Math.sin(a);
    const at = (x, y) => [cx + x * co - y * si, cy + x * si + y * co];
    return { cx, cy, w, h, corners: [at(-w / 2, -h / 2), at(w / 2, -h / 2), at(w / 2, h / 2), at(-w / 2, h / 2)] };
  }
  /** Where a stage point falls on the layer's picture, as fractions across it ([0,1] inside), the mirror undone. */
  function localPoint(g, t, px, py) {
    const a = (t.r * Math.PI) / 180, co = Math.cos(a), si = Math.sin(a);
    const x = (px - g.cx) * co + (py - g.cy) * si, y = -(px - g.cx) * si + (py - g.cy) * co;
    return [(t.fx ? -x : x) / g.w + 0.5, y / g.h + 0.5];
  }
  function scaleLimits(b, W, H) {
    const w0 = (b[2] - b[0]) * W, h0 = (b[3] - b[1]) * H;
    if (!(w0 > 0 && h0 > 0)) return [SCALE_MIN, SCALE_MAX];
    return [Math.max(SCALE_MIN, 16 / Math.min(w0, h0)), Math.min(SCALE_MAX, 4 * Math.min(W / w0, H / h0))];
  }
  /** A layer's middle stays inside the picture, so it can always be found and dragged back. */
  function clampMove(b, dx, dy) {
    const mx = (b[0] + b[2]) / 2, my = (b[1] + b[3]) / 2;
    return [Math.min(1 - mx, Math.max(-mx, dx)), Math.min(1 - my, Math.max(-my, dy))];
  }
  /** Corner k dragged to the pointer: the opposite corner stays, the proportions are kept. */
  function resizeTo(b, t, W, H, k, px, py) {
    const g = geometry(b, t, W, H);
    const a = (t.r * Math.PI) / 180, co = Math.cos(a), si = Math.sin(a);
    const un = (x, y) => [x * co + y * si, -x * si + y * co];
    const C = g.corners[k], O = g.corners[(k + 2) % 4];
